{% extends "base.html" %}
{% block titulo %}Progresso{% endblock %}
{% block conteudo %}

<h3 class="mb-4"><i class="bi bi-bar-chart-line"></i> Dashboard de Progresso</h3>

<div class="row g-4">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Tarefas por status (barras)</h5>
                <canvas id="graficoBarras" height="220"></canvas>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Distribuição de tarefas (pizza)</h5>
                <canvas id="graficoPizza" height="220"></canvas>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
async function carregarProgresso() {
    const resposta = await fetch("{{ url_for('api_progresso') }}");
    const dados = await resposta.json();

    const rotulos = Object.keys(dados);
    const valores = Object.values(dados);
    const cores = ["#ffc107", "#0d6efd", "#198754"]; // amarelo, azul, verde

    new Chart(document.getElementById("graficoBarras"), {
        type: "bar",
        data: {
            labels: rotulos,
            datasets: [{
                label: "Quantidade de tarefas",
                data: valores,
                backgroundColor: cores
            }]
        },
        options: {
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
            plugins: { legend: { display: false } }
        }
    });

    new Chart(document.getElementById("graficoPizza"), {
        type: "pie",
        data: {
            labels: rotulos,
            datasets: [{
                data: valores,
                backgroundColor: cores
            }]
        }
    });
}
carregarProgresso();
</script>
{% endblock %}
