{% extends "base.html" %}
{% block titulo %}{{ "Editar Tarefa" if modo == "editar" else "Nova Tarefa" }}{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="mb-4">
                    {% if modo == "editar" %}
                        <i class="bi bi-pencil-square"></i> Editar Tarefa
                    {% else %}
                        <i class="bi bi-plus-circle"></i> Nova Tarefa
                    {% endif %}
                </h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Título</label>
                        <input type="text" name="titulo" class="form-control"
                               value="{{ tarefa['titulo'] if tarefa else '' }}" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descrição</label>
                        <textarea name="descricao" class="form-control" rows="4">{{ tarefa['descricao'] if tarefa else '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            {% for status in status_opcoes %}
                            <option value="{{ status }}"
                                {% if tarefa and tarefa['status'] == status %}selected
                                {% elif not tarefa and status == "Pendente" %}selected{% endif %}>
                                {{ status }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            {{ "Salvar alterações" if modo == "editar" else "Criar tarefa" }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
